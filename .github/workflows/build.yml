name: Java CI with Maven
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # yangkit 1.7.0 and yangkit-common 1.1.6-SNAPSHOT are not on Maven Central yet, so they are
    # built from source at pinned refs (pom.xml depends on exactly these versions).
    - name: Checkout Yangkit Common Repo
      uses: actions/checkout@v7
      with:
        repository: yang-central/yangkit-common
        ref: 0846d1faf6852037fe99c4114e6a95ce2e05e2d3 # 1.1.6-SNAPSHOT
        path: yangkit-common
    - name: Checkout Yangkit Repo
      uses: actions/checkout@v7
      with:
        repository: yang-central/yangkit
        ref: v1.7.0
        path: yangkit
    - name: Checkout yang-compiler Repo
      uses: actions/checkout@v7
      with:
        repository: network-analytics/yang-compiler
        ref: update-deps
        path: yang-compiler
    - name: Checkout yang-comparator Repo
      uses: actions/checkout@v7
      with:
        repository: network-analytics/yang-comparator
        ref: update-deps
        path: yang-comparator
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build and Install Yangkit Common (Skipping tests)
      run: mvn -B install --file yangkit-common/pom.xml -DskipTests
    - name: Build and Install Yangkit (Skipping tests)
      run: mvn -B install --file yangkit/pom.xml -DskipTests
    - name: Build and Install yang-compiler (Skipping tests)
      run: mvn -B install --file yang-compiler/pom.xml -DskipTests
    - name: Build and Install yang-comparator (Skipping tests)
      run: mvn -B install --file yang-comparator/pom.xml -DskipTests
    - name: Build with Maven
      run: mvn -B package --file pom.xml
